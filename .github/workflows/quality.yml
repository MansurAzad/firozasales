name: Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build (Vercel preset)
        run: NITRO_PRESET=vercel bun run build
